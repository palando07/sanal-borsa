name: Fiyatları güncelle

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/prices.yml"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Yahoo erişim kontrolü
        run: |
          for u in "https://query1.finance.yahoo.com/v8/finance/chart/THYAO.IS?range=1d&interval=30m" "https://query2.finance.yahoo.com/v8/finance/chart/AAPL?range=1d&interval=30m"; do
            c=$(curl -s -m 10 -A "Mozilla/5.0" -o body.txt -w '%{http_code}' "$u"); echo "::notice::$c $(head -c 150 body.txt | tr -d '\n')"
          done
      - name: Fiyatları çek
        run: mkdir -p out && python3 scripts/fetch_prices.py out/prices.json
      - name: data dalına yaz
        # Geçmiş birikmesin diye data dalı her seferinde tek commit olarak yeniden yazılır
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -qm "Fiyatlar $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
